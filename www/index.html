<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>日食观 · Eclipse Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#e8e0d0}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;z-index:10;display:flex;flex-direction:column}
#top-bar{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;gap:8px}
.hud-block{background:rgba(0,0,0,.55);border:1px solid rgba(255,200,80,.25);border-radius:8px;padding:6px 10px;backdrop-filter:blur(4px)}
.hud-label{font-size:9px;color:#a08050;letter-spacing:1px;text-transform:uppercase}
.hud-value{font-size:clamp(14px,4vw,22px);font-weight:900;color:#ffd080;line-height:1.2}
#center-info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 12px 12px;gap:6px}
#eclipse-name{font-size:clamp(16px,5vw,28px);font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,180,60,.6);text-align:center}
#eclipse-meta{font-size:11px;color:#c0a070;text-align:center;max-width:360px;line-height:1.5}
#phase-label{font-size:13px;font-weight:700;color:#ffb040;background:rgba(0,0,0,.6);padding:4px 14px;border-radius:20px;border:1px solid rgba(255,176,64,.4)}
#countdown{font-size:clamp(20px,6vw,36px);font-weight:900;font-variant-numeric:tabular-nums;color:#80d0ff;text-shadow:0 0 16px rgba(80,200,255,.5)}
#timeline-wrap{width:100%;max-width:420px;padding:0 4px;pointer-events:auto}
#timeline{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.12);border-radius:3px;outline:none;cursor:pointer}
#timeline::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#ffb040;box-shadow:0 0 8px rgba(255,176,64,.8);cursor:pointer}
#timeline::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#ffb040;border:none;box-shadow:0 0 8px rgba(255,176,64,.8);cursor:pointer}
#controls{display:flex;gap:8px;justify-content:center;pointer-events:auto;padding-bottom:4px}
.ctrl-btn{background:rgba(20,10,0,.7);border:1px solid rgba(255,176,64,.45);color:#ffd080;font-size:12px;font-weight:700;
  padding:8px 16px;border-radius:20px;cursor:pointer;transition:transform .12s}
.ctrl-btn:active{transform:scale(.94);background:rgba(40,20,0,.8)}
.ctrl-btn.primary{background:linear-gradient(135deg,#c07020,#804010);border-color:#ffb040;color:#fff}
#start-screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#1a1008 0%,#000 70%);padding:20px}
#start-screen h1{font-size:clamp(28px,9vw,52px);font-weight:900;
  background:linear-gradient(180deg,#ffe0a0,#ff9020,#ffe0a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
#start-screen .sub{font-size:13px;color:#907050;margin-bottom:20px;text-align:center}
#eclipse-list{display:flex;flex-direction:column;gap:6px;width:100%;max-width:380px;max-height:42vh;overflow-y:auto;margin-bottom:16px;padding:0 4px}
.ecard{background:rgba(20,12,4,.8);border:1px solid rgba(255,176,64,.25);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;transition:all .15s}
.ecard:active,.ecard.sel{border-color:#ffb040;background:rgba(40,24,8,.9);box-shadow:0 0 16px rgba(255,176,64,.2)}
.ecard .en{font-size:14px;font-weight:700;color:#ffd080}
.ecard .ed{font-size:11px;color:#907050;margin-top:2px}
.ecard .et{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-top:4px;font-weight:600}
.et-total{background:rgba(255,80,40,.2);color:#ff8060;border:1px solid rgba(255,80,40,.4)}
.et-annular{background:rgba(255,200,60,.15);color:#ffc040;border:1px solid rgba(255,200,60,.35)}
.et-partial{background:rgba(120,160,255,.15);color:#80a0ff;border:1px solid rgba(120,160,255,.35)}
#start-btn{background:linear-gradient(135deg,#e08020,#a05010);border:none;color:#fff;font-size:18px;font-weight:900;
  padding:12px 44px;border-radius:28px;cursor:pointer;box-shadow:0 4px 24px rgba(224,128,32,.35)}
#start-btn:active{transform:scale(.95)}
#safety{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:40;
  background:rgba(120,20,20,.85);border:1px solid rgba(255,80,80,.5);color:#ffb0b0;font-size:10px;
  padding:4px 12px;border-radius:12px;max-width:90%;text-align:center;display:none}
#safety.show{display:block}
#voice-dot{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;
  background:#00ff66;z-index:50;display:none}
#voice-dot.active{display:block;animation:vp .8s ease-in-out infinite}
@keyframes vp{0%,100%{opacity:.3;box-shadow:0 0 4px #00ff66}50%{opacity:1;box-shadow:0 0 14px #00ff66,0 0 28px #00ff6688}}
#ring-status,#cane-status{position:fixed;right:.5rem;font-size:.55rem;padding:.12rem .35rem;border-radius:2rem;z-index:50;display:none;
  background:rgba(0,0,0,.6);color:#607080;border:1px solid #304050}
#ring-status{top:2rem}#cane-status{top:3.4rem}
#ring-status.active,#cane-status.active{display:flex;align-items:center;gap:.2rem}
#ring-status.active{color:#60a5fa;border-color:#60a5fa}
#cane-status.active{color:#c084fc;border-color:#c084fc}
#corona-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:rgba(255,220,160,.5);
  pointer-events:none;z-index:5;display:none;text-align:center;line-height:1.6}
#loc-bar{display:flex;align-items:center;gap:8px;width:100%;max-width:380px;margin-bottom:10px;padding:0 4px;pointer-events:auto}
#loc-status{flex:1;font-size:11px;color:#807060;line-height:1.4}
#loc-status.ok{color:#60c080}#loc-status.err{color:#c06060}
#loc-btn{background:rgba(20,12,4,.8);border:1px solid rgba(255,176,64,.35);color:#ffd080;font-size:11px;
  font-weight:700;padding:6px 12px;border-radius:14px;cursor:pointer;white-space:nowrap}
#loc-btn:active{background:rgba(40,24,8,.9)}
.ecard .local-tag{display:block;font-size:10px;margin-top:4px;font-weight:600}
.local-total{color:#ff8060}.local-annular{color:#ffc040}.local-partial{color:#80a0ff}.local-none{color:#605050}
#local-info{font-size:11px;color:#80a060;text-align:center;max-width:360px;line-height:1.5}
@media(max-width:400px) and (max-height:320px),(max-width:320px) and (max-height:400px){
  html{font-size:11px}#eclipse-name{font-size:14px}#countdown{font-size:18px}.ctrl-btn{font-size:10px;padding:6px 12px}
}
@media(max-width:280px),(max-height:300px){
  html{font-size:9px}#top-bar{padding:4px 6px}.hud-value{font-size:12px}#eclipse-name{font-size:12px}
  #phase-label{font-size:10px;padding:3px 10px}#countdown{font-size:16px}.ctrl-btn{font-size:9px;padding:5px 10px}
  #start-screen h1{font-size:20px}#start-btn{font-size:14px;padding:8px 28px}.ecard .en{font-size:11px}
}
@media(max-width:420px) and (max-height:340px),(max-width:340px) and (max-height:420px){
  html{font-size:10px}#top-bar{padding:6px 8px}#hud-label{font-size:7px}#eclipse-name{font-size:14px}
  #eclipse-meta{font-size:9px}#phase-label{font-size:10px}#countdown{font-size:18px}
  #start-screen h1{font-size:22px}#start-btn{font-size:14px;padding:9px 32px}
  #corona-hint{font-size:9px}#safety{font-size:8px;padding:3px 8px}
}
</style>
</head>
<body>
<div id="start-screen">
  <h1>日食观</h1>
  <p class="sub">智能眼镜 · 沉浸式日食体验</p>
  <div id="loc-bar">
    <div id="loc-status">📍 正在获取 GPS 定位…</div>
    <button id="loc-btn" onclick="reqGPS()">重新定位</button>
  </div>
  <div id="eclipse-list"></div>
  <button id="start-btn" onclick="enterViewer()">▶ 开始观看</button>
  <p style="font-size:10px;color:#605040;margin-top:10px;text-align:center">👓 说「下一个」「播放」「暂停」控制 · 💍 倾斜拖动时间轴</p>
</div>
<div id="safety">⚠ 请勿用智能眼镜直视真实太阳，需佩戴日食观测镜</div>
<div id="hud" style="display:none">
  <div id="top-bar">
    <div class="hud-block"><div class="hud-label">本地食分</div><div class="hud-value" id="obscuration">0%</div></div>
    <div class="hud-block" style="text-align:center"><div class="hud-label">倒计时</div><div class="hud-value" id="cd-hud">--</div></div>
    <div class="hud-block" style="text-align:right"><div class="hud-label">本地类型</div><div class="hud-value" id="type-hud">--</div></div>
  </div>
  <div id="corona-hint">日冕显现中<br>摘下滤镜可观赏</div>
  <div id="center-info">
    <div id="eclipse-name">--</div>
    <div id="eclipse-meta">--</div>
    <div id="local-info"></div>
    <div id="phase-label">初亏</div>
    <div id="countdown">--</div>
    <div id="timeline-wrap"><input type="range" id="timeline" min="0" max="1000" value="0" oninput="scrubManual(this.value)"></div>
    <div id="controls">
      <button class="ctrl-btn" onclick="prevEclipse()">◀ 上一个</button>
      <button class="ctrl-btn primary" id="play-btn" onclick="togglePlay()">▶ 播放</button>
      <button class="ctrl-btn" onclick="nextEclipse()">下一个 ▶</button>
    </div>
  </div>
</div>
<div id="voice-dot"></div>
<div id="ring-status">💍</div>
<div id="cane-status">🦯</div>
<canvas id="sky"></canvas>

<script>
// ==================== ECLIPSE DATA ====================
// path: 中心线航点 [lat,lon] · pathWidthKm: 本影宽度 · penUmbraKm: 半影延伸
const ECLIPSES=[
  {id:"2026-02-17",name:"2026 环食 · 南极",type:"annular",date:"2026-02-17T09:13:00Z",
   region:"南极洲 · 南太平洋",duration:"2分20秒",magnitude:0.963,
   pathWidthKm:120,penUmbraKm:2800,
   path:[[-58,165],[-61,152],[-63,140],[-65,128]]},
  {id:"2026-08-12",name:"2026 全食 · 北极",type:"total",date:"2026-08-12T17:47:00Z",
   region:"格陵兰 · 冰岛 · 西班牙",duration:"2分18秒",magnitude:1.039,
   pathWidthKm:294,penUmbraKm:4200,
   path:[[72,-55],[68,-40],[65.4,-25.2],[58,-12],[48,-5],[40,0],[30,3]]},
  {id:"2027-02-06",name:"2027 环食 · 南美",type:"annular",date:"2027-02-06T12:30:00Z",
   region:"智利 · 阿根廷",duration:"7分51秒",magnitude:0.928,
   pathWidthKm:210,penUmbraKm:3200,
   path:[[-12,-82],[-25,-72],[-38,-65],[-48,-58],[-55,-52]]},
  {id:"2027-08-02",name:"2027 全食 · 地中海",type:"total",date:"2027-08-02T10:07:00Z",
   region:"摩洛哥 · 西班牙 · 埃及",duration:"6分23秒",magnitude:1.079,
   pathWidthKm:258,penUmbraKm:4000,
   path:[[28,-16],[34,-8],[40.9,22.2],[38,32],[32,38],[25,42]]},
  {id:"2028-01-26",name:"2028 环食 · 南美",type:"annular",date:"2028-01-26T15:08:00Z",
   region:"厄瓜多尔 · 秘鲁 · 巴西",duration:"10分27秒",magnitude:0.921,
   pathWidthKm:240,penUmbraKm:3400,
   path:[[10,-85],[0,-78],[-10,-68],[-20,-58],[-30,-48],[-38,-40]]},
  {id:"2028-07-22",name:"2028 全食 · 澳新",type:"total",date:"2028-07-22T02:56:00Z",
   region:"澳大利亚 · 新西兰",duration:"5分10秒",magnitude:1.057,
   pathWidthKm:272,penUmbraKm:3800,
   path:[[-12,130],[-22,140],[-32,150],[-42,165],[-48,172],[-52,175]]},
  {id:"2030-06-01",name:"2030 环食 · 地中海",type:"annular",date:"2030-06-01T06:45:00Z",
   region:"阿尔及利亚 · 突尼斯 · 希腊",duration:"5分21秒",magnitude:0.944,
   pathWidthKm:230,penUmbraKm:3600,
   path:[[28,5],[34,12],[38,20],[40,28],[38,36],[32,42]]},
  {id:"2031-11-14",name:"2031 全食 · 中美",type:"total",date:"2031-11-14T21:07:00Z",
   region:"巴拿马 · 美国",duration:"3分51秒",magnitude:1.047,
   pathWidthKm:280,penUmbraKm:4100,
   path:[[8,-85],[12,-82],[15,-78],[18,-74],[22,-70],[28,-65]]}
];
const TYPE_CN={total:"全食",annular:"环食",partial:"偏食",none:"不可见"};
const PHASES=["初亏 C1","食既 C2","食甚 MAX","生光 C3","复圆 C4"];

// ==================== GEO / GPS ====================
const R_EARTH=6371;
const DEG=Math.PI/180;
let userLoc=null,localCache={};

function toRad(d){return d*DEG}
function haversineKm(lat1,lon1,lat2,lon2){
  const p1=toRad(lat1),p2=toRad(lat2),dp=toRad(lat2-lat1),dl=toRad(lon2-lon1);
  const a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R_EARTH*Math.asin(Math.min(1,Math.sqrt(a)))}

function bearing(lat1,lon1,lat2,lon2){
  const p1=toRad(lat1),p2=toRad(lat2),dl=toRad(lon2-lon1);
  return Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))}

function crossTrackKm(lat,lon,latA,lonA,latB,lonB){
  const brg12=bearing(latA,lonA,latB,lonB);
  const brg13=bearing(latA,lonA,lat,lon);
  const d13=haversineKm(latA,lonA,lat,lon)/R_EARTH;
  return Math.abs(Math.asin(Math.sin(d13)*Math.sin(brg13-brg12)))*R_EARTH}

function distToPathKm(lat,lon,path){
  let min=Infinity;
  for(let i=0;i<path.length-1;i++){
    const d=crossTrackKm(lat,lon,path[i][0],path[i][1],path[i+1][0],path[i+1][1]);
    if(d<min)min=d}
  path.forEach(p=>{const d=haversineKm(lat,lon,p[0],p[1]);if(d<min)min=d});
  return min}

function sunAltitude(lat,lon,date){
  const y=date.getUTCFullYear(),m=date.getUTCMonth()+1,d=date.getUTCDate();
  const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  const jdn=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
  const jd=jdn+(date.getUTCHours()-12)/24+date.getUTCMinutes()/1440+date.getUTCSeconds()/86400;
  const n=jd-2451545,T=n/36525;
  const L=(280.46646+36000.76983*T)%360;
  const g=toRad((357.52911+35999.05029*T)%360);
  const lam=toRad(L+1.914602*T*Math.sin(g)+0.019993*T*Math.sin(2*g));
  const eps=toRad(23.439291-0.0130042*T);
  const alpha=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam));
  const delta=Math.asin(Math.sin(eps)*Math.sin(lam));
  const ut=date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
  const lst=toRad(ut*15+lon),H=lst-alpha,phi=toRad(lat);
  return Math.asin(Math.sin(phi)*Math.sin(delta)+Math.cos(phi)*Math.cos(delta)*Math.cos(H))/DEG}

function calcLocal(e,lat,lon){
  const crossKm=distToPathKm(lat,lon,e.path);
  const umbraHalf=e.pathWidthKm/2;
  const sunAlt=sunAltitude(lat,lon,new Date(e.date));
  let maxObsc=0,localType="none",visible=false;

  if(sunAlt>0){
    if(crossKm<=umbraHalf){
      if(e.type==="total"){maxObsc=1;localType="total"}
      else{maxObsc=e.magnitude;localType="annular"}
      visible=true}
    else if(crossKm<=umbraHalf+e.penUmbraKm){
      const t=(crossKm-umbraHalf)/e.penUmbraKm;
      const centerObs=e.type==="total"?1:e.magnitude;
      maxObsc=centerObs*(1-t*t)*.92;
      if(maxObsc>.02){localType="partial";visible=true;maxObsc=Math.min(.95,maxObsc)}}
  }
  return{crossKm:Math.round(crossKm),sunAlt:Math.round(sunAlt*10)/10,
    maxObsc:Math.round(maxObsc*1000)/1000,localType,visible,
    mag:visible?Math.round(maxObsc*e.magnitude*100)/100:0}}

function getLocal(e){
  if(!userLoc)return null;
  if(!localCache[e.id])localCache[e.id]=calcLocal(e,userLoc.lat,userLoc.lon);
  return localCache[e.id]}

function fmtCoord(lat,lon){
  const ns=lat>=0?"N":"S",ew=lon>=0?"E":"W";
  return Math.abs(lat).toFixed(2)+"°"+ns+" "+Math.abs(lon).toFixed(2)+"°"+ew}

function localTagText(loc){
  if(!loc.visible)return'<span class="local-tag local-none">本地不可见</span>';
  const pct=Math.round(loc.maxObsc*100);
  const cls=loc.localType==="total"?"local-total":loc.localType==="annular"?"local-annular":"local-partial";
  const label=TYPE_CN[loc.localType]+" "+pct+"%";
  return'<span class="local-tag '+cls+'">📍 本地 '+label+' · 距中心线 '+loc.crossKm+'km</span>'}

function reqGPS(){
  const el=document.getElementById("loc-status");
  el.className="";el.textContent="📍 正在获取 GPS 定位…";
  if(!navigator.geolocation){
    el.className="err";el.textContent="❌ 设备不支持 GPS";return}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLoc={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};
      localCache={};
      el.className="ok";
      el.textContent="📍 "+fmtCoord(userLoc.lat,userLoc.lon)+" ±"+userLoc.acc+"m";
      buildList();if(started)updateHUD()},
    err=>{
      el.className="err";
      el.textContent=err.code===1?"❌ 请允许位置权限以计算本地食分":"❌ 定位失败，请重试"},
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000})}

// ==================== STATE ====================
let selIdx=0,phaseT=0,playing=false,animId=null,started=false;
let stars=[],prominences=[],beads=[];
const canvas=document.getElementById("sky"),ctx=canvas.getContext("2d");

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;initStars()}
window.addEventListener("resize",resize);resize();

function initStars(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random(),y:Math.random(),s:Math.random()*1.8+.2,a:Math.random()})}
function initBeads(){beads=[];for(let i=0;i<12;i++)beads.push({a:i/12*Math.PI*2,r:.92+Math.random()*.06})}

// ==================== UI ====================
function buildList(){
  const el=document.getElementById("eclipse-list");el.innerHTML="";
  ECLIPSES.forEach((e,i)=>{
    const d=document.createElement("div");d.className="ecard"+(i===selIdx?" sel":"");
    const tc=e.type==="total"?"et-total":e.type==="annular"?"et-annular":"et-partial";
    const cd=fmtCountdown(new Date(e.date)-Date.now());
    const loc=getLocal(e),localHtml=loc?localTagText(loc):"";
    d.innerHTML=`<div class="en">${e.name}</div><div class="ed">${e.region} · ${e.duration}</div>
      <span class="et ${tc}">${TYPE_CN[e.type]||e.type}</span>
      <span style="float:right;font-size:10px;color:#5080a0;margin-top:4px">${cd}</span>${localHtml}`;
    d.onclick=()=>{selIdx=i;document.querySelectorAll(".ecard").forEach(c=>c.classList.remove("sel"));d.classList.add("sel")};
    el.appendChild(d)})}

function enterViewer(){
  started=true;phaseT=0;playing=true;
  document.getElementById("start-screen").style.display="none";
  document.getElementById("hud").style.display="flex";
  document.getElementById("safety").classList.add("show");
  updateHUD();initBeads();detGl();initRing();initCane();
  if(!animId)loop()}

function fmtCountdown(ms){
  if(ms<=0)return"已发生";
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  if(d>365)return Math.floor(d/365)+"年后";
  if(d>0)return d+"天"+h+"时";
  if(h>0)return h+"时"+m+"分";
  return m+"分"}

function localPeakObsc(){
  const loc=getLocal(ECLIPSES[selIdx]);
  return loc&&loc.visible?loc.maxObsc:ECLIPSES[selIdx].type==="annular"?ECLIPSES[selIdx].magnitude:1}

function updateHUD(){
  const e=ECLIPSES[selIdx],peak=localPeakObsc(),curve=phaseCurve(phaseT,peak);
  const obs=curve.obsc,loc=getLocal(e);
  document.getElementById("eclipse-name").textContent=e.name;
  document.getElementById("eclipse-meta").textContent=e.region+" · 最长 "+e.duration+" · 中心食分 "+e.magnitude;
  const li=document.getElementById("local-info");
  if(loc){
    if(loc.visible){
      li.textContent="📍 本地"+TYPE_CN[loc.localType]+" · 最大遮蔽 "+Math.round(loc.maxObsc*100)+"% · 距中心线 "+loc.crossKm+"km · 太阳高度 "+loc.sunAlt+"°";
      li.style.color=loc.localType==="total"?"#ff8060":loc.localType==="annular"?"#ffc040":"#80a0ff"}
    else{li.textContent="📍 本地不可见（太阳高度 "+loc.sunAlt+"° 或不在半影区）";li.style.color="#605050"}}
  else{li.textContent=userLoc===null?"等待 GPS 定位…":"重新计算中…";li.style.color="#807060"}
  document.getElementById("obscuration").textContent=Math.round(obs*100)+"%";
  const dispType=loc&&loc.visible?TYPE_CN[loc.localType]:TYPE_CN[e.type];
  document.getElementById("type-hud").textContent=dispType;
  document.getElementById("phase-label").textContent=PHASES[curve.phaseIdx];
  document.getElementById("timeline").value=Math.round(phaseT*1000);
  const ms=new Date(e.date)-Date.now();
  document.getElementById("countdown").textContent=fmtCountdown(ms);
  document.getElementById("cd-hud").textContent=fmtCountdown(ms);
  const showCorona=e.type==="total"&&obs>=peak*.998&&(!loc||loc.localType==="total");
  document.getElementById("corona-hint").style.display=showCorona?"block":"none";
  document.getElementById("play-btn").textContent=playing?"⏸ 暂停":"▶ 播放"}

function phaseCurve(t,peak){
  peak=peak!=null?peak:1;
  const e=ECLIPSES[selIdx];
  let obsc,moonOff,phaseIdx;
  if(e.type==="total"){
    if(t<.15){obsc=t/.15*.3*peak;moonOff=1-t/.15*.7;phaseIdx=0}
    else if(t<.35){const p=(t-.15)/.2;obsc=(.3+p*.65)*peak;moonOff=.3*(1-p);phaseIdx=1}
    else if(t<.65){obsc=(.95+(t-.35)/.3*.05)*peak;moonOff=0;phaseIdx=2}
    else if(t<.85){const p=(t-.65)/.2;obsc=(1-p*.65)*peak;moonOff=.3*p;phaseIdx=3}
    else{obsc=(.35-(t-.85)/.15*.35)*peak;moonOff=.3+(t-.85)/.15*.7;phaseIdx=4}
  }else if(e.type==="annular"){
    if(t<.2){obsc=t/.2*.5*peak;moonOff=1-t/.2*.5;phaseIdx=0}
    else if(t<.4){const p=(t-.2)/.2;obsc=(.5+p*.45)*peak;moonOff=.5*(1-p);phaseIdx=1}
    else if(t<.6){obsc=(.92+(t-.4)/.2*.04)*peak;moonOff=.05;phaseIdx=2}
    else if(t<.8){const p=(t-.6)/.2;obsc=(.96-p*.46)*peak;moonOff=.05+p*.45;phaseIdx=3}
    else{obsc=(.5-(t-.8)/.2*.5)*peak;moonOff=.5+(t-.8)/.2*.5;phaseIdx=4}
  }else{
    obsc=Math.sin(t*Math.PI)*.85*peak;moonOff=1-obsc;phaseIdx=t<.5?0:4}
  return{obsc:Math.max(0,Math.min(peak,obsc)),moonOff:Math.max(0,Math.min(1,moonOff)),phaseIdx}
}

function togglePlay(){playing=!playing;updateHUD()}
function scrubManual(v){phaseT=v/1000;playing=false;updateHUD()}
function nextEclipse(){selIdx=(selIdx+1)%ECLIPSES.length;phaseT=0;initBeads();updateHUD()}
function prevEclipse(){selIdx=(selIdx-1+ECLIPSES.length)%ECLIPSES.length;phaseT=0;initBeads();updateHUD()}

// ==================== RENDER ====================
function loop(){
  if(started){
    if(playing){phaseT+=.0012;if(phaseT>=1){phaseT=0;initBeads()}updateHUD()}
    drawSky()}
  animId=requestAnimationFrame(loop)}

function drawSky(){
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H*.46;
  const e=ECLIPSES[selIdx],peak=localPeakObsc(),curve=phaseCurve(phaseT,peak);
  const R=Math.min(W,H)*.22,sunR=R,moonR=e.type==="annular"?R*1.02:R*.98;
  const dx=curve.moonOff*R*2.2;

  // sky gradient
  const skyDark=curve.obsc>.7?.02+curve.obsc*.08:.08;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H));
  g.addColorStop(0,`rgb(${Math.round(8+skyDark*20)},${Math.round(6+skyDark*12)},${Math.round(20+skyDark*40)})`);
  g.addColorStop(1,"#000");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // stars (visible during totality)
  if(curve.obsc>.85){
    const sa=(curve.obsc-.85)/.15;
    stars.forEach(s=>{ctx.globalAlpha=s.a*sa;ctx.fillStyle="#fff";ctx.fillRect(s.x*W,s.y*H*.8,s.s,s.s)});
    ctx.globalAlpha=1}

  // sun glow
  const glow=ctx.createRadialGradient(cx-dx/2,cy,0,cx-dx/2,cy,sunR*3);
  glow.addColorStop(0,`rgba(255,${Math.round(200-curve.obsc*120)},${Math.round(80-curve.obsc*60)},${.3+.5*(1-curve.obsc)})`);
  glow.addColorStop(1,"rgba(255,120,20,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  // corona (total eclipse)
  const loc=getLocal(e);
  const canShowCorona=e.type==="total"&&curve.obsc>.95*peak&&(!loc||loc.localType==="total");
  if(canShowCorona){
    const ca=(curve.obsc/peak-.95)/.05;
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2+phaseT*Math.PI;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.quadraticCurveTo(cx+Math.cos(a)*sunR*2,cy+Math.sin(a)*sunR*2,cx+Math.cos(a+0.3)*sunR*3.5,cy+Math.sin(a+0.3)*sunR*3.5);
      ctx.strokeStyle=`rgba(255,240,200,${.08*ca})`;ctx.lineWidth=8;ctx.stroke()}
    const cg=ctx.createRadialGradient(cx,cy,sunR*.8,cx,cy,sunR*4);
    cg.addColorStop(0,`rgba(255,250,230,${.15*ca})`);cg.addColorStop(.5,`rgba(255,200,100,${.06*ca})`);cg.addColorStop(1,"rgba(255,150,50,0)");
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,sunR*4,0,Math.PI*2);ctx.fill()}

  // sun disc
  const sg=ctx.createRadialGradient(cx-dx/2,cy,sunR*.1,cx-dx/2,cy,sunR);
  sg.addColorStop(0,"#fff8e0");sg.addColorStop(.6,"#ffd040");sg.addColorStop(1,"#ff9010");
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx-dx/2,cy,sunR,0,Math.PI*2);ctx.fill();

  // moon disc
  ctx.fillStyle="#080810";ctx.beginPath();ctx.arc(cx+dx/2,cy,moonR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(60,60,80,.5)";ctx.lineWidth=1;ctx.stroke();

  // baily's beads & diamond ring
  if(curve.obsc>.7&&curve.obsc<1&&e.type==="total"){
    beads.forEach(b=>{
      const bx=cx+Math.cos(b.a)*sunR*.95,by=cy+Math.sin(b.a)*sunR*.95;
      const flick=.5+.5*Math.sin(phaseT*40+b.a*3);
      ctx.beginPath();ctx.arc(bx,by,3+flick*2,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,240,180,${.6*flick})`;ctx.fill()})}
  if(e.type==="total"&&curve.obsc>.92&&curve.obsc<.999){
    const bx=cx+Math.cos(-Math.PI/4+phaseT*2)*sunR*.98,by=cy+Math.sin(-Math.PI/4+phaseT*2)*sunR*.98;
    const dg=ctx.createRadialGradient(bx,by,0,bx,by,sunR*.6);
    dg.addColorStop(0,"rgba(255,255,240,.9)");dg.addColorStop(1,"rgba(255,200,80,0)");
    ctx.fillStyle=dg;ctx.beginPath();ctx.arc(bx,by,sunR*.5,0,Math.PI*2);ctx.fill()}

  // annular ring
  const showRing=(loc?loc.localType==="annular":e.type==="annular")&&curve.obsc>.8*peak;
  if(showRing){
    ctx.strokeStyle=`rgba(255,220,80,${.5+.3*Math.sin(phaseT*20)})`;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(cx,cy,sunR*.92,0,Math.PI*2);ctx.stroke()}

  // horizon glow during totality
  if(curve.obsc>.9){
    const hg=ctx.createLinearGradient(0,H*.7,0,H);
    hg.addColorStop(0,"rgba(80,40,20,0)");hg.addColorStop(1,`rgba(120,60,20,${(curve.obsc-.9)*.3})`);
    ctx.fillStyle=hg;ctx.fillRect(0,H*.7,W,H*.3)}
}

// ==================== GLASSES VOICE ====================
let voiceRecog=null,glassesMode=false;
function detGl(){
  const w=Math.min(window.innerWidth,screen.width||9999),h=Math.min(window.innerHeight,screen.height||9999);
  glassesMode=(w<=420&&h<=340)||(w<=340&&h<=420);
  if(glassesMode)startVI();return glassesMode}
function startVI(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
  try{voiceRecog=new SR();voiceRecog.lang="zh-CN";voiceRecog.continuous=true;voiceRecog.interimResults=false;
  voiceRecog.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim().toLowerCase();
    document.getElementById("voice-dot").classList.add("active");
    if(/播放|开始|start|go/.test(t)){if(!started)enterViewer();else{playing=true;updateHUD()}}
    else if(/暂停|停|pause|stop/.test(t)){playing=false;updateHUD()}
    else if(/下一个|next|切换/.test(t))nextEclipse();
    else if(/上一个|prev|返回/.test(t))prevEclipse();
    else if(/快进|forward/.test(t)){phaseT=Math.min(1,phaseT+.05);updateHUD()}
    else if(/后退|back|倒/.test(t)){phaseT=Math.max(0,phaseT-.05);updateHUD()}
    else if(/定位|位置|gps|location/.test(t))reqGPS()};
  voiceRecog.onerror=()=>{};voiceRecog.onend=()=>{if(glassesMode)voiceRecog.start()};
  voiceRecog.start();document.getElementById("voice-dot").classList.add("active")}catch(e){}}

// ==================== SMART RING ====================
let ringActive=false,ringBeta=0,ringGamma=0,ringFc=0;
const RTH=8,RTILT=5,RSHAKE=18;
function initRing(){
  if(typeof DeviceOrientationEvent==="undefined")return;
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    document.addEventListener("click",function rp(){
      DeviceOrientationEvent.requestPermission().then(s=>{if(s==="granted")startRing()}).catch(()=>{})},{once:true})}
  else startRing()}
function startRing(){
  ringActive=true;document.getElementById("ring-status").classList.add("active");
  window.addEventListener("deviceorientation",onRing)}
function onRing(e){
  if(!ringActive||!started)return;ringFc++;if(ringFc%RTH!==0)return;
  const b=e.beta||0,g=e.gamma||0,db=b-ringBeta,dg=g-ringGamma;ringBeta=b;ringGamma=g;
  if(Math.abs(db)>RSHAKE||Math.abs(dg)>RSHAKE){nextEclipse();return}
  if(Math.abs(dg)>RTILT){phaseT=Math.max(0,Math.min(1,phaseT+dg*.002));playing=false;updateHUD()}
  else if(Math.abs(db)>RTILT){phaseT=Math.max(0,Math.min(1,phaseT+db*.002));playing=false;updateHUD()}}

// ==================== SMART CANE ====================
let caneActive=false,caneFc=0,lastTap=0;
const CTH=6,CTAP=8;
function initCane(){
  if(typeof DeviceMotionEvent==="undefined")return;
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    document.addEventListener("click",function cp(){
      DeviceMotionEvent.requestPermission().then(s=>{if(s==="granted")startCane()}).catch(()=>{})},{once:true})}
  else startCane()}
function startCane(){
  caneActive=true;document.getElementById("cane-status").classList.add("active");
  window.addEventListener("devicemotion",onCane)}
function onCane(e){
  if(!caneActive||!started)return;caneFc++;if(caneFc%CTH!==0)return;
  const a=e.accelerationIncludingGravity||e.acceleration||{},ax=a.x||0,ay=a.y||0,az=a.z||0;
  const dm=Math.sqrt(ax*ax+ay*ay+az*az);const now=Date.now();
  if(dm>CTAP&&now-lastTap>400){lastTap=now;togglePlay()}
  else if(dm>5){phaseT=Math.max(0,Math.min(1,phaseT+ax*.003));playing=false;updateHUD()}}

// ==================== INIT ====================
(function init(){
  const now=Date.now();
  for(let i=0;i<ECLIPSES.length;i++){if(new Date(ECLIPSES[i].date)>now){selIdx=i;break}}
  buildList();initBeads();detGl();reqGPS();
  setInterval(()=>{if(!started)buildList();else updateHUD()},30000)})();
</script>
